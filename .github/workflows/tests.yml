name: Tests

# Required status check backing branch protection on main/alpha/beta (see
# CONTRIBUTING.md). This repo ships no PHPUnit suite — every class depends on
# a running Kintai Core that doesn't exist here — so this only catches PHP
# syntax errors and malformed manifests, not logic bugs.

on:
  push:
    branches: [main, alpha, beta]
  pull_request:
    branches: [main, alpha, beta]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP syntax
        run: |
          set -euo pipefail
          find src Views -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l routes.php

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          for f in bundle.json lang/*.json; do
            jq empty "$f"
          done

      # Kintai envoie `script-src 'self' 'nonce-…'` : un attribut onclick=/onchange=/…, un lien javascript: ou un
      # <script> sans nonce est bloqué par le navigateur, en silence (rien ne casse côté serveur, donc aucun autre
      # test ne l'attrape). Voir « Content Security Policy » dans docs/creating-a-bundle.md du dépôt Kintai.
      - name: No inline event handlers or nonce-less scripts (Kintai CSP)
        run: |
          set -euo pipefail
          paths=$(ls -d Views src 2>/dev/null || true)
          if grep -rnE "[[:space:]]on(click|change|submit|input|load|error|focus|blur|dblclick|keyup|keydown)[[:space:]]*=|['\"]on(click|change|submit|input)['\"][[:space:]]*=>|(href|src|action)[[:space:]]*=[[:space:]]*[\"']javascript:|<script>" $paths; then
            echo "::error::Inline handlers, javascript: URLs and <script> without nonce are blocked by Kintai's CSP. Use data-on-click / data-confirm / data-submit-on-change, and <script nonce=\"...\">."
            exit 1
          fi
